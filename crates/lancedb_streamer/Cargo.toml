[package]
name = "lancedb_streamer"
version = "0.1.0"
edition = "2021"

[dependencies]
lancedb = { version = "0.38", features = ["remote"] }
tokio = { version = "1", features = ["full"] }
arrow-array = "58.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }
base64 = "0.22"
byteorder = "1.5"
